name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Swift build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Assemble app bundle
        run: ./scripts/build_app.sh
